name: Build Hardened Native APK & IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Android Wrapper if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.zinnour.cryocalc --project-name cryocalc_pro .
          fi
      - name: Harden Android Manifest (Zero Backup / Zero Cleartext)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:allowBackup="false" android:usesCleartextTraffic="false"/' "$MANIFEST" || true
          fi
      - run: flutter pub get
      - name: Build Obfuscated & Shrunk Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols-android
      - uses: actions/upload-artifact@v4
        with:
          name: CryoCalcPro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios-free:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate iOS Wrapper if Missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.zinnour.cryocalc --project-name cryocalc_pro .
          fi
      - run: flutter pub get
      - name: Build Obfuscated Release iOS App
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols-ios
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CryoCalcPro-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CryoCalcPro-iOS-IPA
          path: CryoCalcPro-iOS.ipa
