name: Build Free Native APK & IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate Android Wrapper if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.zinnour.cryocalc --project-name cryocalc_pro .
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CryoCalcPro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios-free:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Generate iOS Wrapper if Missing
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --org com.zinnour.cryocalc --project-name cryocalc_pro .
          fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package Unsigned IPA (Free Sideload Ready)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r CryoCalcPro-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CryoCalcPro-iOS-IPA
          path: CryoCalcPro-iOS.ipa
