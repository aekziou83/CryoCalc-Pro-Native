name: Build CryoCalc Pro v5.3 APK & IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android & iOS Wrappers if Missing
        run: |
          if [ ! -d "android" ] || [ ! -d "ios" ]; then
            flutter create --platforms=android,ios --org com.zinnour.cryocalc --project-name cryocalc_pro .
          fi

      - name: Prepare Assets, Verified Arabic PDF Font & App Icon
        run: |
          mkdir -p assets/fonts
          download_font() {
            local out="$1"
            shift
            for url in "$@"; do
              echo "Trying font: $url"
              if curl -fsSL "$url" -o "$out" && [ -s "$out" ] && [ "$(wc -c < "$out")" -gt 30000 ]; then
                echo "Verified font saved to $out ($(wc -c < "$out") bytes)"
                return 0
              fi
            done
            echo "ERROR: Could not download valid Arabic TTF font for $out"
            exit 1
          }
          download_font assets/fonts/Arabic-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf"
          download_font assets/fonts/Arabic-Bold.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf"
          cp assets/fonts/Arabic-Regular.ttf assets/fonts/Cairo-Regular.ttf
          cp assets/fonts/Arabic-Bold.ttf assets/fonts/Cairo-Bold.ttf

          SRC=$(find assets -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) 2>/dev/null | head -n 1 || true)
          if [ -z "$SRC" ]; then
            SRC=$(find . -maxdepth 1 -type f \( -iname "icon.*" -o -iname "logo.*" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$SRC" ]; then
            python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages -q pillow
            python3 -c "from PIL import Image; Image.open('$SRC').convert('RGBA').resize((1024,1024)).save('assets/icon_tmp.png','PNG')"
            mv assets/icon_tmp.png assets/icon.png
          fi

      - run: flutter pub get

      - name: Generate Launcher Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: CryoCalcPro-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0

  build-ios-free:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android & iOS Wrappers if Missing
        run: |
          if [ ! -d "android" ] || [ ! -d "ios" ]; then
            flutter create --platforms=android,ios --org com.zinnour.cryocalc --project-name cryocalc_pro .
          fi

      - name: Configure iOS Podfile Deployment Target
        run: |
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios, .*/platform :ios, '13.0'/" ios/Podfile || true
            sed -i '' "s/platform :ios, '12.0'/platform :ios, '13.0'/" ios/Podfile || true
          fi

      - name: Prepare Assets, Verified Arabic PDF Font & App Icon (macOS)
        run: |
          mkdir -p assets/fonts
          download_font() {
            local out="$1"
            shift
            for url in "$@"; do
              echo "Trying font: $url"
              if curl -fsSL "$url" -o "$out" && [ -s "$out" ] && [ "$(wc -c < "$out")" -gt 30000 ]; then
                echo "Verified font saved to $out ($(wc -c < "$out") bytes)"
                return 0
              fi
            done
            echo "ERROR: Could not download valid Arabic TTF font for $out"
            exit 1
          }
          download_font assets/fonts/Arabic-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Regular.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Regular.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf"
          download_font assets/fonts/Arabic-Bold.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal/Tajawal-Bold.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/almarai/Almarai-Bold.ttf" \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf"
          cp assets/fonts/Arabic-Regular.ttf assets/fonts/Cairo-Regular.ttf
          cp assets/fonts/Arabic-Bold.ttf assets/fonts/Cairo-Bold.ttf

          SRC=$(find assets -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) 2>/dev/null | head -n 1 || true)
          if [ -z "$SRC" ]; then
            SRC=$(find . -maxdepth 1 -type f \( -iname "icon.*" -o -iname "logo.*" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$SRC" ]; then
            sips -s format png -z 1024 1024 "$SRC" --out assets/icon_tmp.png
            mv assets/icon_tmp.png assets/icon.png
          fi

      - run: flutter pub get

      - name: Generate Launcher Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            dart run flutter_launcher_icons
          fi

      - name: Build Release iOS App
        run: flutter build ios --release --no-codesign

      - name: Ad-Hoc Sign & Package Clean IPA (LiveContainer / SideStore Ready)
        run: |
          rm -rf Payload CryoCalcPro-iOS.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          chmod +x Payload/Runner.app/Runner
          xattr -cr Payload/Runner.app || true
          rm -rf Payload/Runner.app/_CodeSignature
          if [ -d "Payload/Runner.app/Frameworks" ]; then
            find Payload/Runner.app/Frameworks -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - Payload/Runner.app
          COPYFILE_DISABLE=1 zip -qry -X CryoCalcPro-iOS.ipa Payload
          ls -lh CryoCalcPro-iOS.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CryoCalcPro-iOS-IPA
          path: CryoCalcPro-iOS.ipa
          compression-level: 0

  publish-release:
    needs: [build-android, build-ios-free]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Direct Install Files
        run: |
          mv artifacts/CryoCalcPro-Android-APK/app-release.apk CryoCalcPro.apk
          mv artifacts/CryoCalcPro-iOS-IPA/CryoCalcPro-iOS.ipa CryoCalcPro-iOS.ipa

      - name: Publish Direct APK & IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.3-latest
          name: CryoCalc Pro v5.3 (Direct APK & IPA)
          make_latest: true
          files: |
            CryoCalcPro.apk
            CryoCalcPro-iOS.ipa
