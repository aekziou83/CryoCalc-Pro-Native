name: cryocalc_pro
description: CryoCalc Pro - Native Offline HVAC Cold Room & 3D CAD Engineering App by Eng. Ahmed Zinnour.
publish_to: 'none'
version: 4.6.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#070D19"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#070D19"
  image: "assets/icon.png"
  android_12:
    color: "#070D19"
    image: "assets/icon.png"
  ios: true
