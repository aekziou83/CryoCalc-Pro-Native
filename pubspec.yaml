name: cryocalc_pro
description: CryoCalc Pro v5.0 - Trilingual Offline HVAC Cold Room, Scientific Component Sizing, 3D CAD & PDF Print App by Eng. Ahmed Zinnour.
publish_to: 'none'
version: 5.0.0+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#070D19"
  adaptive_icon_foreground: "assets/icon.png"
